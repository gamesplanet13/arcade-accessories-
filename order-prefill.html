<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manual Order Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f2f4f8;padding:15px}
.container{max-width:580px;margin:auto;background:#fff;padding:20px;border-radius:12px}
h1{text-align:center;color:#0d6efd;margin-bottom:5px}
h2{text-align:center;font-size:14px;color:#555}
input,select,textarea{
  width:100%;padding:12px;margin:6px 0;
  border:1px solid #ccc;border-radius:6px;font-size:15px
}
textarea{resize:none}
.box{border:1px dashed #ccc;padding:10px;border-radius:6px;margin-top:10px}
.radio{display:flex;justify-content:space-around}
.choice-grid{display:grid;gap:8px;margin-top:8px}
.choice-grid label{
  display:flex;align-items:center;gap:8px;padding:9px;
  border:1px solid #d6dce5;border-radius:7px;background:#f8fafc
}
.choice-grid input{width:auto;margin:0}
.choice-title{display:block;margin-top:12px;font-weight:700}
#batteryDeliveryNotice{
  display:none;margin-top:8px;padding:8px;border-radius:6px;
  background:#fff4d6;color:#8a5200;font-size:12px
}
.note{font-size:12px;color:#c00}
button{
  width:100%;padding:14px;margin-top:15px;
  background:#28a745;color:#fff;border:none;
  border-radius:6px;font-size:16px
}
#deliveryEstimate{white-space:pre-line;color:green;font-size:14px;margin-top:6px}
#miniPreview{display:none;font-size:14px;margin-top:8px}
#liveCourierRate{
  display:none;margin-top:8px;padding:10px;border-radius:7px;
  background:#eef8ff;border:1px solid #9bd3f5;color:#075985;
  font-size:13px;line-height:1.55
}
</style>
</head>

<body>
<div class="container">

<h1>Manual Order Page</h1>
<h2>Fill details carefully</h2>

<input id="name" placeholder="Name">
<input id="mobile" placeholder="Mobile">
<input id="altmobile" placeholder="Alt Mobile">
<input id="email" placeholder="Email">

<textarea id="address" placeholder="Full Address"></textarea>
<input id="landmark" placeholder="Landmark">

<input id="pincode" placeholder="Pincode">
<input id="state" placeholder="State" readonly>
<input id="city" placeholder="District/City" readonly>

<select id="postoffice">
  <option value="">Select Post Office</option>
</select>

<div id="deliveryEstimate"></div>
<div id="liveCourierRate"></div>

<div id="miniPreview">
  <div>⏳ Prepaid ETA: <span id="preEta"></span></div>
  <div>📅 Prepaid Delivery: <span id="preRange"></span></div>
</div>

<input type="hidden" id="distance">
<input type="hidden" id="etaText">
<input type="hidden" id="dateRange">

<div class="box">
<b>💳 Choose Payment Method</b>
<div class="choice-grid">
<label><input type="radio" name="otype" value="Prepaid" checked onchange="syncPaymentFields()"> Full Payment (Prepaid)</label>
<label><input type="radio" name="otype" value="COD" onchange="syncPaymentFields()"> COD: Min. ₹2,500 Order • ₹600 or 20% Advance</label>
</div>

<span class="choice-title">⚡ Choose Delivery Speed</span>
<div class="choice-grid">
  <label><input type="radio" name="deliverySpeed" value="surface" checked onchange="syncOrderChoices()"> Surface Delivery</label>
  <label id="prefillAirOption"><input type="radio" name="deliverySpeed" value="air" onchange="syncOrderChoices()"> By Air Delivery</label>
  <label id="prefillPrimeOption"><input type="radio" name="deliverySpeed" value="prime" onchange="syncOrderChoices()"> Prime Trackon.in</label>
</div>
<div id="batteryDeliveryNotice">🔋 Battery item selected: only Surface Delivery is available.</div>

<label class="choice-title" for="prefillCourier">🚚 Choose Your Preferred Courier Service</label>
<select id="prefillCourier" onchange="syncOrderChoices()"></select>
</div>

<div class="box">
<b>Product Details</b>

<input id="manualProduct" value="Arcade Accessories" readonly>




</div>






<input id="amountPaid" readonly placeholder="Amount Paid">
<input id="restOnDelivery" readonly placeholder="Rest on Delivery" style="display:none">

<button onclick="sendOrder()">Submit Order on WhatsApp</button>

</div>

<script>

/* ===== ORDER ID ===== */
function orderID(){
  const d=new Date();
  return d.getDate().toString().padStart(2,'0')+
  (d.getMonth()+1).toString().padStart(2,'0')+
  d.getFullYear()+
  d.getHours().toString().padStart(2,'0')+
  d.getMinutes().toString().padStart(2,'0')+
  d.getSeconds().toString().padStart(2,'0')+"00";
}
</script>

<!-- ===== ETA / PINCODE SYSTEM (UNCHANGED – TERA CODE) ===== -->
<script>
let pincodeLatLng={};
fetch('pincode_data.json').then(r=>r.json()).then(j=>pincodeLatLng=j);
  let pincodeDB={};

fetch("pincode_database.json")
.then(r=>r.json())
.then(data=>{
   pincodeDB=data;
});

function haversine(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function etaByDist(d){
  if(d<=30)return"1 day";
  if(d<=60)return"1-2 days";
  if(d<=100)return"2-3 days";
  if(d<=200)return"3-4 days";
  if(d<=500)return"4-5 days";
  if(d<=1000)return"4-6 days";
  if(d<=1500)return"5–7 days";
  if(d<=2000)return"6–8 days";
  if(d<=3000)return"6–10 days";
  return"8–12 days";
}

function parseEta(eta){
  const n=(eta.match(/\d+/g)||[]).map(Number);
  if(n.length===1) return {min:n[0],max:n[0]};
  return {min:Math.min(...n),max:Math.max(...n)};
}

function dayStartOffset(){
  const n=new Date();
  return (n.getDay()>=1 && n.getDay()<=5 && n.getHours()>=19)?1:0;
}

function formatDateRange(min,max){
  const o=dayStartOffset();
  const s=new Date(),e=new Date();
  s.setDate(s.getDate()+min+o);
  e.setDate(e.getDate()+max+o);
  const opt={weekday:"long",day:"2-digit",month:"long",year:"numeric"};
  return `${s.toLocaleDateString("en-IN",opt)} – ${e.toLocaleDateString("en-IN",opt)}`;
}
const distance = document.getElementById("distance");
const etaText = document.getElementById("etaText");
const dateRange = document.getElementById("dateRange");

const preEta = document.getElementById("preEta");
const codEta = document.getElementById("codEta");
const codRange = document.getElementById("codRange");

const state = document.getElementById("state");
const city = document.getElementById("city");

const miniPreview = document.getElementById("miniPreview");
const deliveryEstimate =
document.getElementById("deliveryEstimate");
document.getElementById("pincode").addEventListener("input",function(){
  const pin=this.value.trim();
  if(pin.length===6){
  const db1 = pincodeDB[pin];
const db2 = pincodeLatLng[pin];

if(db2){

   state.value = db2.state || "";
   city.value = db2.city || "";

   postoffice.innerHTML='<option value="">Select Post Office</option>';
   (db2.postoffices || []).forEach(po=>{
      const opt=document.createElement('option');
      opt.value=po;
      opt.textContent=po;
      postoffice.appendChild(opt);
   });

}
else if(db1){

   state.value = db1.state || "";
   city.value = "";

   postoffice.innerHTML='<option value="">Select Post Office</option>';
   (db1.postoffices || []).forEach(po=>{
      const opt=document.createElement('option');
      opt.value=po;
      opt.textContent=po;
      postoffice.appendChild(opt);
   });

}
else{

   state.value = "";
   city.value = "";
   postoffice.innerHTML='<option value="">Select Post Office</option>';

}

        if(pincodeLatLng[pin]){
          const baseLat=28.8,baseLng=79.0;
          const {lat,lng}=pincodeLatLng[pin];
          const d=Math.round(haversine(baseLat,baseLng,lat,lng));
          const eta=etaByDist(d);
          const pre=parseEta(eta);
          const prepaidRange=formatDateRange(pre.min,pre.max);
          const cod={min:pre.min+2,max:pre.max+3};

          distance.value=d+" km";
          etaText.value=eta;
          dateRange.value=prepaidRange;

          preEta.textContent=eta;
          document.getElementById("preRange").textContent=prepaidRange;
          if(codEta) codEta.textContent=`${cod.min}–${cod.max} days`;
          if(codRange) codRange.textContent=formatDateRange(cod.min,cod.max);

          deliveryEstimate.innerText =
`📏 Distance: ${d} km
⏳ Prepaid ETA: ${eta}
📅 Prepaid Delivery: ${prepaidRange}`;

miniPreview.style.display="block";
        }
else{

  distance.value="N/A";
  etaText.value="5-8 days";
  dateRange.value="Standard Delivery";

  deliveryEstimate.innerText=
  "⏳ Standard ETA: 5-8 days";

  miniPreview.style.display="block";
}

syncOrderChoices();
}
});
</script>

<script>

/* ===== SEND WHATSAPP ===== */
function sendOrder(){
let orderSummary=null;
try{
  orderSummary=JSON.parse(localStorage.getItem("gp_order_summary")||"null");
}catch(e){
  orderSummary=null;
}
if(orderSummary && ["Delhivery.com","BlueDart","Ecom Express","XpressBees"].includes(orderSummary.courier) && !liveRateReady){
  alert("Please enter a valid pincode and wait for the live courier price before submitting.");
  return;
}

let summaryText="";
if(orderSummary && Array.isArray(orderSummary.items) && orderSummary.items.length){
  const itemLines=orderSummary.items.map((item,index)=>
`${index+1}) ${item.name}
Quantity: ${item.quantity}
Per Product Price: ₹${item.unitPrice}
Product Total: ₹${item.lineTotal}
Per Product Weight: ${item.unitWeight} g
Total Product Weight: ${item.lineWeight} g`
  );

  summaryText=`

━━━━━━━━━━━━━━
📦 PRODUCT SUMMARY
━━━━━━━━━━━━━━

${itemLines.join("\n\n")}

Total Cart Items: ${orderSummary.totalQuantity}
Products Amount: ₹${orderSummary.productTotal}
Actual Product Weight: ${orderSummary.totalWeight} g
Packing Weight: ${orderSummary.packingWeight||0} g
Packed Weight: ${orderSummary.packedWeight} g
Chargeable Courier Weight: ${orderSummary.chargeableKg} kg
Delivery Speed: ${orderSummary.deliverySpeed}
Courier: ${orderSummary.courier}
Courier Charges: ₹${orderSummary.courierCharge}
VAS (2%): ₹${orderSummary.vasCharge||0}
Grand Total: ₹${orderSummary.grandTotal}`;
}

const orderType=document.querySelector('input[name="otype"]:checked')?.value||"Prepaid";
const amountPaid=Number(document.getElementById("amountPaid").value||0);
const restOnDelivery=Number(document.getElementById("restOnDelivery").value||0);

const msg=`${orderType==="COD"?"🟠 COD Order":"🟢 Prepaid Order"}

Order ID: ${orderID()}
Name: ${document.getElementById("name").value}
Mobile: ${document.getElementById("mobile").value}
Alt Mobile: ${document.getElementById("altmobile").value}
Email: ${document.getElementById("email").value}
Address: ${document.getElementById("address").value}
Landmark: ${document.getElementById("landmark").value}
Pincode: ${document.getElementById("pincode").value}
State: ${document.getElementById("state").value}
District/City: ${document.getElementById("city").value}
Post Office: ${document.getElementById("postoffice").value}

Product: Arcade Accessories
Payment Type: ${orderType}
Amount Paid: ₹${amountPaid}
${orderType==="COD"?`Rest on Delivery: ₹${restOnDelivery}`:""}

📏 Distance: ${document.getElementById("distance").value}
⏳ ETA: ${document.getElementById("etaText").value}
📅 Estimated Delivery: ${document.getElementById("dateRange").value}${summaryText}`;

window.open("https://wa.me/917983624797?text="+encodeURIComponent(msg));
}
</script>


<script>
const params=new URLSearchParams(window.location.search);
document.getElementById("manualProduct").value="Arcade Accessories";
const savedSummary=JSON.parse(localStorage.getItem("gp_order_summary")||"null");
const initialMode=params.get("paymentMode")||savedSummary?.paymentMode||"prepaid";
let grandTotal=Number(params.get("grandTotal")||savedSummary?.grandTotal||0);
const orderProductValue=Number(savedSummary?.productTotal||grandTotal||0);
const suppliedAdvance=Number(params.get("advanceAmount")||savedSummary?.advanceAmount||0);
let advanceAmount=Math.max(600,Math.ceil(grandTotal*0.20),suppliedAdvance);
let restAmount=Number(params.get("restAmount")||savedSummary?.restAmount||Math.max(0,grandTotal-advanceAmount));
let liveRateReady=false;
const modeRadio=document.querySelector(`input[name="otype"][value="${initialMode==="cod"?"COD":"Prepaid"}"]`);
if(modeRadio) modeRadio.checked=true;

const COURIERS_SURFACE=["Trackon.in","Shreemaruti.com","Dtdc.in","Speed Post","Delhivery.com","BlueDart","Ecom Express","XpressBees"];
const COURIERS_AIR=["Trackon.in","Shreemaruti.com"];
const COURIERS_PRIME=["Trackon.in"];
const COURIERS_COD=["Delhivery.com","BlueDart","Ecom Express","XpressBees"];
const LIVE_RATE_COURIERS=["Delhivery.com","BlueDart","Ecom Express","XpressBees"];
const SPEED_MULTIPLIER={surface:1,air:1.5,prime:2};

function selectedPaymentMode(){
  return document.querySelector('input[name="otype"]:checked')?.value==="COD"?"cod":"prepaid";
}
function selectedDeliverySpeed(){
  return document.querySelector('input[name="deliverySpeed"]:checked')?.value||"surface";
}
function courierBaseRate(courier){
  return ["Speed Post","Delhivery.com","BlueDart","Ecom Express","XpressBees"].includes(courier)?200:100;
}

function syncCourierOptions(){
  const paymentMode=selectedPaymentMode();
  const speed=selectedDeliverySpeed();
  const select=document.getElementById("prefillCourier");
  const previous=select.value||savedSummary?.courier||"Trackon.in";
  const allowed=paymentMode==="cod"
    ? COURIERS_COD
    : speed==="air"
      ? COURIERS_AIR
      : speed==="prime"
        ? COURIERS_PRIME
        : COURIERS_SURFACE;
  select.innerHTML=allowed.map(c=>`<option value="${c}">${c}</option>`).join("");
  select.value=allowed.includes(previous)?previous:allowed[0];
}

function syncDeliveryAvailability(){
  const batterySelected=Boolean(savedSummary?.hasBatteryItem);
  const codSelected=selectedPaymentMode()==="cod";
  const surfaceOnly=batterySelected||codSelected;
  document.getElementById("prefillAirOption").style.display=surfaceOnly?"none":"flex";
  document.getElementById("prefillPrimeOption").style.display=surfaceOnly?"none":"flex";
  document.getElementById("batteryDeliveryNotice").style.display=batterySelected?"block":"none";
  if(surfaceOnly){
    const surface=document.querySelector('input[name="deliverySpeed"][value="surface"]');
    if(surface) surface.checked=true;
  }
}

function applyPaymentFields(){
  let isCod=selectedPaymentMode()==="cod";
  if(isCod && orderProductValue<2500){
    alert("COD is available only for product orders of ₹2,500 or more.");
    const prepaidRadio=document.querySelector('input[name="otype"][value="Prepaid"]');
    if(prepaidRadio) prepaidRadio.checked=true;
    isCod=false;
  }
  document.getElementById("amountPaid").value=isCod?advanceAmount:grandTotal;
  document.getElementById("restOnDelivery").value=isCod?Math.max(0,grandTotal-advanceAmount):0;
  document.getElementById("restOnDelivery").style.display=isCod?"block":"none";
}

function syncPaymentFields(){
  syncDeliveryAvailability();
  syncCourierOptions();
  applyPaymentFields();
  syncOrderChoices();
}

function applyCalculatedRate(courierPrice,rateSource){
  const paymentMode=selectedPaymentMode();
  const courier=document.getElementById("prefillCourier").value;
  const speed=selectedDeliverySpeed();
  const subtotalWithCourier=savedSummary.productTotal+courierPrice;
  const vasCharge=Math.ceil(subtotalWithCourier*0.02);
  grandTotal=subtotalWithCourier+vasCharge;
  advanceAmount=paymentMode==="cod"?Math.max(600,Math.ceil(grandTotal*0.20)):grandTotal;
  restAmount=paymentMode==="cod"?Math.max(0,grandTotal-advanceAmount):0;

  savedSummary.paymentMode=paymentMode;
  savedSummary.paymentType=paymentMode==="cod"?"COD":"Prepaid";
  savedSummary.deliverySpeed=({surface:"Surface Delivery",air:"By Air Delivery",prime:"Prime Trackon.in"})[speed];
  savedSummary.courier=courier;
  savedSummary.courierCharge=courierPrice;
  savedSummary.vasCharge=vasCharge;
  savedSummary.grandTotal=grandTotal;
  savedSummary.advanceAmount=advanceAmount;
  savedSummary.restAmount=restAmount;
  savedSummary.rateSource=rateSource;
  localStorage.setItem("gp_order_summary",JSON.stringify(savedSummary));
  applyPaymentFields();
  return {courierPrice,vasCharge};
}

function applyStaticFallback(){
  if(!savedSummary) return;
  const courier=document.getElementById("prefillCourier").value;
  const speed=selectedDeliverySpeed();
  const paymentMode=selectedPaymentMode();
  const multiplier=paymentMode==="cod"?1:SPEED_MULTIPLIER[speed];
  const courierPrice=Math.ceil((savedSummary.chargeableKg||1)*courierBaseRate(courier)*multiplier);
  applyCalculatedRate(courierPrice,"Fallback rate");
}

async function syncOrderChoices(){
  if(!savedSummary) return;
  syncDeliveryAvailability();
  syncCourierOptions();
  liveRateReady=false;
  applyStaticFallback();
  const pin=document.getElementById("pincode").value.trim();
  const courier=document.getElementById("prefillCourier").value;
  if(pin.length===6 && LIVE_RATE_COURIERS.includes(courier)){
    await calculateLiveCourierRate(pin);
  }else{
    const box=document.getElementById("liveCourierRate");
    box.style.display=LIVE_RATE_COURIERS.includes(courier)?"block":"none";
    if(LIVE_RATE_COURIERS.includes(courier)) box.textContent="📍 Enter destination pincode for live courier price.";
    liveRateReady=!LIVE_RATE_COURIERS.includes(courier);
  }
}

async function calculateLiveCourierRate(pin){
  if(!savedSummary || !/^[1-9][0-9]{5}$/.test(pin)) return;
  const courier=document.getElementById("prefillCourier").value;
  if(!LIVE_RATE_COURIERS.includes(courier)) return;

  const box=document.getElementById("liveCourierRate");
  box.style.display="block";
  box.textContent="🚚 Live courier price checking…";

  const paymentMode=selectedPaymentMode();
  try{
    const response=await fetch("https://games-planet-courier-rates.gamesplanet.chatgpt.site/rate",{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({
        destinationPincode:pin,
        weightGrams:savedSummary.packedWeight||((savedSummary.chargeableKg||1)*1000),
        paymentMode,
        codAmount:paymentMode==="cod"?savedSummary.productTotal:0
      })
    });
    const result=await response.json();
    if(!response.ok || !Number.isFinite(Number(result.courierPrice))){
      throw new Error(result.error||"Live rate unavailable");
    }

    const courierPrice=Math.ceil(Number(result.courierPrice));
    const calculated=applyCalculatedRate(courierPrice,"Delhivery Live API");
    liveRateReady=true;

    box.innerHTML=`✅ Live price applied<br>
Courier (${courier}): ₹${courierPrice}<br>
VAS (2%): ₹${calculated.vasCharge}<br>
Grand Total: ₹${grandTotal}`;
  }catch(error){
    liveRateReady=false;
    box.textContent="⚠️ Live courier price unavailable. Existing fallback price is retained.";
  }
}
syncDeliveryAvailability();
syncCourierOptions();
syncPaymentFields();
</script>
</body>
</html>
